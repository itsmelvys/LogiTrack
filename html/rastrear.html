<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogiTrack - Rastrear pedido</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <div class="caixa">
      <header class="topo">
        <a href="login.html">LogiTrack</a>
        <span class="menu">☰</span>
      </header>

      <main class="conteudo">
        <h1 class="titulo-pagina">Rastrear pedido</h1>

        <form>
          <div class="campo">
            <span class="icone">🔍</span>
            <input type="text" placeholder="Digite o número do pedido" />
          </div>

          <button class="botao" type="button">Buscar</button>
        </form>
      </main>

      <footer class="rodape">
        <div class="bolinhas">
          <span class="bolinha"></span>
          <span class="bolinha ativa"></span>
          <span class="bolinha"></span>
          <span class="bolinha"></span>
          <span class="bolinha"></span>
        </div>
        <h2>Consulte seu pedido</h2>
        <p>Digite o número do pedido para ver o status.</p>
      </footer>
    </div>
  </body>
</html>
