<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogiTrack - Login</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <div class="caixa">
      <main class="conteudo">
        <header class="logo">
          <div class="caminhao">🚚</div>
          <h1 class="nome-app">LogiTrack</h1>
          <p class="subtitulo">Rastreamento de Entregas</p>
        </header>

        <form>
          <div class="campo">
            <span class="icone">✉</span>
            <input type="email" placeholder="E-mail" />
          </div>

          <div class="campo">
            <span class="icone">🔒</span>
            <input type="password" placeholder="Senha" />
          </div>

          <a class="botao" href="rastrear.html">Entrar</a>
        </form>

        <a class="link" href="#">Esqueci minha senha</a>
      </main>

      <footer class="rodape">
        <div class="bolinhas">
          <span class="bolinha ativa"></span>
          <span class="bolinha"></span>
          <span class="bolinha"></span>
          <span class="bolinha"></span>
          <span class="bolinha"></span>
        </div>
        <h2>Acesse sua conta</h2>
        <p>Entre para acompanhar seus pedidos.</p>
      </footer>
    </div>
  </body>
</html>
